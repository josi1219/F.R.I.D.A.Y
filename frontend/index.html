<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F.R.I.D.A.Y.</title>
  <meta name="description" content="Female Replacement Intelligent Digital Assistant Youth — Your personal AI">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown + Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <!-- ═══════════════ SIDEBAR ═══════════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-group">
        <div class="logo-icon">F</div>
        <div>
          <div class="logo-text">F.R.I.D.A.Y.</div>
          <div class="logo-sub">AI Assistant</div>
        </div>
      </div>
      <button class="sidebar-toggle" id="toggleSidebarTop" title="Collapse sidebar">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New conversation
    </button>

    <div class="convo-list-header">Conversations</div>
    <div class="convo-list" id="convoList"></div>

    <div class="sidebar-footer">
      <div class="status-indicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Connecting...</span>
      </div>
    </div>
  </aside>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="main">

    <!-- Top bar -->
    <div class="chat-topbar">
      <button class="topbar-toggle" id="toggleSidebarBottom" title="Toggle sidebar">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-title" id="topbarTitle">F.R.I.D.A.Y.</div>
      <div class="topbar-actions">
        <button class="topbar-btn" id="autoTTSBtn" title="Toggle auto-speak">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
          Auto-speak
        </button>
        <button class="topbar-btn" id="clearChatBtn" title="Delete this conversation">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14H6L5 6"/>
          </svg>
          Clear
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-wrap" id="messagesWrap">
      <div class="messages-inner" id="messagesInner"></div>
    </div>

    <!-- File upload preview -->
    <div class="upload-preview" id="uploadPreview" style="max-width:780px;margin:0 auto;width:calc(100% - 40px)">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span class="upload-preview-name" id="uploadName">file.pdf</span>
      <button class="upload-remove-btn" id="removeUpload" title="Remove file">&times;</button>
    </div>

    <!-- Input area -->
    <div class="input-section">
      <div class="input-outer">
        <div class="input-box" id="inputBox">
          <textarea
            id="userInput"
            placeholder="Message F.R.I.D.A.Y. …"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <div class="input-actions">
            <button class="input-btn" id="uploadBtn" title="Attach file">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <button class="input-btn" id="micBtn" title="Voice input">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
                <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
            <button class="input-btn send-btn" id="sendBtn" title="Send message">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="input-hint">F.R.I.D.A.Y. can make mistakes. Verify important information.</div>
      </div>
    </div>

  </main>

</div>

<!-- Hidden file input -->
<input type="file" id="uploadInput" class="hidden"
       accept=".pdf,.doc,.docx,.txt,.py,.js,.ts,.json,.csv,.md,.png,.jpg,.jpeg,.webp">

<!-- Hidden audio player -->
<audio id="audioPlayer"></audio>

<!-- Rename modal -->
<div class="modal-overlay" id="renameModal">
  <div class="modal">
    <h2>Rename conversation</h2>
    <input type="text" id="renameInput" placeholder="Conversation title" maxlength="100">
    <div class="modal-actions">
      <button class="modal-btn secondary" id="renameCancel">Cancel</button>
      <button class="modal-btn primary" id="renameConfirm">Rename</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/static/app.js"></script>
</body>
</html>
