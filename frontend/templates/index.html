<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F.R.I.D.A.Y.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <!-- highlight.js for code blocks -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
</head>
<body>
  <div class="app-shell">

    <!-- ── Sidebar ──────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="14" cy="14" r="12" stroke="#60a5fa" stroke-width="1.5"/>
            <circle cx="14" cy="14" r="4" fill="#60a5fa"/>
            <line x1="14" y1="2" x2="14" y2="7" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="14" y1="21" x2="14" y2="26" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="2" y1="14" x2="7" y2="14" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="21" y1="14" x2="26" y2="14" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <span class="sidebar-logo-text">F.R.I.D.A.Y.</span>
        </div>
        <button class="icon-btn sidebar-toggle-btn" id="sidebarToggle" title="Close sidebar" aria-label="Toggle sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        New conversation
      </button>

      <div class="conversations-scroll" id="conversationsList">
        <!-- Populated by JS -->
        <div class="conv-empty" id="convEmpty">
          <p>No conversations yet</p>
        </div>
      </div>

      <div class="sidebar-footer">
        <div class="status-indicator" id="statusIndicator">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-label" id="statusLabel">F.R.I.D.A.Y. Online</span>
        </div>
      </div>
    </aside>

    <!-- ── Main chat area ───────────────────────────── -->
    <main class="chat-main" id="chatMain">

      <!-- Header bar -->
      <div class="chat-header">
        <button class="icon-btn open-sidebar-btn" id="openSidebarBtn" title="Open sidebar" aria-label="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <h1 class="chat-title" id="chatTitle">F.R.I.D.A.Y.</h1>
        <div class="header-actions">
          <button class="icon-btn" id="clearChatBtn" title="Clear conversation">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="3,6 5,6 21,6"/><path d="M19,6l-1,14H6L5,6"/><path d="M10,11v6"/><path d="M14,11v6"/><path d="M9,6V4h6v2"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Messages area -->
      <div class="messages-area" id="messagesArea">

        <!-- Welcome screen (shown when no messages) -->
        <div class="welcome-screen" id="welcomeScreen">
          <div class="welcome-logo">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="32" cy="32" r="28" stroke="#60a5fa" stroke-width="2" opacity="0.6"/>
              <circle cx="32" cy="32" r="10" fill="#60a5fa" opacity="0.8"/>
              <line x1="32" y1="4" x2="32" y2="16" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
              <line x1="32" y1="48" x2="32" y2="60" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
              <line x1="4" y1="32" x2="16" y2="32" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
              <line x1="48" y1="32" x2="60" y2="32" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
              <line x1="11.5" y1="11.5" x2="20" y2="20" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
              <line x1="44" y1="44" x2="52.5" y2="52.5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
              <line x1="52.5" y1="11.5" x2="44" y2="20" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
              <line x1="20" y1="44" x2="11.5" y2="52.5" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
            </svg>
          </div>
          <h2 class="welcome-title">F.R.I.D.A.Y.</h2>
          <p class="welcome-sub">Female Replacement Intelligent Digital Assistant Youth</p>
          <div class="welcome-suggestions" id="welcomeSuggestions">
            <button class="suggestion-chip" data-msg="What can you do?">What can you do?</button>
            <button class="suggestion-chip" data-msg="Check my system status">Check system status</button>
            <button class="suggestion-chip" data-msg="What's the weather like?">What's the weather?</button>
            <button class="suggestion-chip" data-msg="Tell me a joke">Tell me a joke</button>
          </div>
        </div>

        <!-- Messages container -->
        <div class="messages-container" id="messagesContainer"></div>

      </div><!-- /messages-area -->

      <!-- Input area -->
      <div class="input-section">
        <div class="input-wrapper" id="inputWrapper">
          <button class="voice-btn" id="voiceBtn" title="Voice input" aria-label="Voice input">
            <svg class="mic-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M19 10a7 7 0 0 1-14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </button>
          <textarea
            id="messageInput"
            placeholder="Message F.R.I.D.A.Y.…"
            rows="1"
            maxlength="4000"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="send-btn" id="sendBtn" disabled title="Send message" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
        <p class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</p>
      </div>

    </main><!-- /chat-main -->

  </div><!-- /app-shell -->

  <!-- Rename modal -->
  <div class="modal-overlay" id="renameModal" role="dialog" aria-modal="true" aria-label="Rename conversation" hidden>
    <div class="modal-box">
      <h3>Rename conversation</h3>
      <input type="text" id="renameInput" maxlength="80" placeholder="Conversation title" />
      <div class="modal-actions">
        <button class="btn-secondary" id="renameCancelBtn">Cancel</button>
        <button class="btn-primary" id="renameSaveBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Notification toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
